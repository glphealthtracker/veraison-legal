<style>

  a.card{display:block;padding:22px 24px;background:var(--forest);color:var(--cream);text-decoration:none;border-radius:12px;transition:transform .15s;}
  a.card:hover{transform:translateY(-2px);}
  a.card strong{font-size:19px;display:block;}
  a.card span{font-size:14px;color:var(--gold);font-family:Arial,sans-serif;}
